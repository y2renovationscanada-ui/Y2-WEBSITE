[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Direct 1-hop 301 redirects to canonical apex domain
[[redirects]]
  from = "http://www.y2designandbuild.com/*"
  to = "https://y2designandbuild.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.y2designandbuild.com/*"

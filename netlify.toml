[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Direct 1-hop 301 redirects to canonical apex domain
[[redirects]]
  from = "http://www.y2designandbuild.com/*"
  to = "https://y2designandbuild.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.y2designandbuild.com/*"
  to = "https://y2designandbuild.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://y2designandbuild.com/*"
  to = "https://y2designandbuild.com/:splat"
  status = 301
  force = true  

# Pretty URLs for the static Next export (folder/index.html)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "https://y2designandbuild.com/walk-in-showers-vs-bathtubs-what-homeowners-prefer-in-2026/*"
  to = "https://y2designandbuild.com/"
  status = 301
  force = true

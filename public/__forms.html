<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>Forms</title></head>
  <body>
    <!-- Hidden mirror of the quote form so Netlify's build bot registers it for the static export. -->
    <form name="quote-request" data-netlify="true" netlify-honeypot="bot-field" action="/" method="POST" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="address" />
      <select name="projectType"><option>Bathroom</option></select>
      <textarea name="details"></textarea>
      <input type="text" name="page" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
